services:
  aeromotion-api:
    build: .
    image: aeromotion-predictive-maintenance:1.0.0
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /app/artifacts/model.joblib
      MODEL_VERSION: 1.0.0
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
